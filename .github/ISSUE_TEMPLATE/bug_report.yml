name: Bug report
description: Report a reproducible Scrcpy Studio problem
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Do not include pairing codes, private keys, or sensitive device data.
  - type: input
    id: version
    attributes:
      label: Scrcpy Studio version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: scrcpy and ADB versions
      placeholder: scrcpy 4.1; ADB 36.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      render: text
