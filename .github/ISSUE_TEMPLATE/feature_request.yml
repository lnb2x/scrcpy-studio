name: Feature request
description: Suggest a focused product improvement
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow or limitation, not only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Mirroring and scrcpy configuration
        - Devices and ADB
        - Wireless debugging
        - Recording
        - Runtime and installation
        - Other
